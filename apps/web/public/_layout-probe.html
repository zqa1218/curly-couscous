<!doctype html>
<!--
  仅用于开发期视觉检查：把应用按 1440x900 渲染后整体缩小，
  这样在窄面板里也能确认桌面三栏布局。不参与生产构建的界面。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>layout probe</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0c1016;
      }
      .frame {
        width: 1440px;
        height: 900px;
        border: 0;
        display: block;
        transform-origin: top left;
      }
      /* 默认不缩放，让整页截图能拿到 1440 像素宽的原图 */
      body.scaled .frame {
        transform: scale(0.32);
      }
      body.scaled {
        width: 461px;
        height: 288px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <iframe class="frame" src="/" id="frame"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      if (params.get("fit") === "1") {
        document.body.classList.add("scaled");
      }
      // 把本页的查询参数原样转发给应用，支持深链：
      // /_layout-probe.html?view=workbench&stage=S4&project=<id>
      const forward = new URLSearchParams(params);
      forward.delete("fit");
      const query = forward.toString();
      const frame = document.getElementById("frame");
      if (query && frame) {
        frame.src = "/?" + query;
      }
    </script>
  </body>
</html>

    <iframe class="frame" src="/"></iframe>
  </body>
</html>
